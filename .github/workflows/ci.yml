name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: SQLite for the database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Check formatting (generated l10n excluded)
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v 'l10n/app_localizations')
      - run: flutter analyze
      - run: flutter test

